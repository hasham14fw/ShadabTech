<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="stGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="stGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hex Shield / Tech Boundary -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" 
           fill="#0A1128" 
           stroke="url(#stGrad1)" 
           stroke-width="3" 
           stroke-linejoin="round" />

  <!-- Inner Hex Ring -->
  <polygon points="50,12 85,30 85,70 50,88 15,70 15,30" 
           fill="none" 
           stroke="#0066FF" 
           stroke-width="1" 
           stroke-dasharray="4 3" 
           opacity="0.6" />

  <!-- "S" Pathway Monogram -->
  <path d="M68 28 H38 C32 28 28 32 28 38 C28 44 32 48 38 48 H62 C68 48 72 52 72 58 C72 64 68 68 62 68 H32" 
        fill="none" 
        stroke="url(#stGrad1)" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- "T" Tech Crossbar & Stem -->
  <line x1="34" y1="36" x2="66" y2="36" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" />
  <line x1="50" y1="36" x2="50" y2="76" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" />

  <!-- Glowing Corner Circuit Nodes -->
  <circle cx="50" cy="4" r="3.5" fill="#00E5FF" />
  <circle cx="92" cy="26" r="3" fill="#0066FF" />
  <circle cx="92" cy="74" r="3" fill="#00E5FF" />
  <circle cx="50" cy="96" r="3.5" fill="#0066FF" />
  <circle cx="8" cy="74" r="3" fill="#00E5FF" />
  <circle cx="8" cy="26" r="3" fill="#0066FF" />

  <!-- Central Pulse Node -->
  <circle cx="50" cy="56" r="3" fill="#00E5FF" filter="url(#glow)" />
</svg>
